name: Update Dependencies
on: workflow_dispatch
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm install --package-lock-only --legacy-peer-deps
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate package-lock.json for axios upgrade"
          file_pattern: 'frontend/package-lock.json'
